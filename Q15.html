<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        color: blueviolet;
        font-size: large;
        text-align: center;
      }
      .container {
        background-color: bisque;
        border: 10px blue double;
        outline: 6px red dashed;
        margin: 180px 300px;
        padding: 20px;
        height: 200px;
        width: 50%;
      }
      #notice {
        color: green;
        font-size: larger;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-variant: small-caps;
        text-align: center;
        font-size: large;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Notice Box</h2>
      <p id="notice">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Hic minus
        minima commodi fuga nesciunt deserunt excepturi delectus ipsum neque
        velit quaerat esse fugit, recusandae est ab odit ullam debitis atque.
      </p>
    </div>
  </body>
</html>
