<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        background: linear-gradient(green, cyan, blue);
        height: 200px;
        width: 150px;
        border-radius: 20%;
      }
      .box2 {
        background: radial-gradient(red, yellow, blue);
        border-radius: 50%;
        height: 200px;
        width: 150px;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box2"></div>
  </body>
</html>
